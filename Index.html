<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hypothesis Testing Tool</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:350px;
    background:white;
    padding:20px;
    overflow-y:auto;
    border-right:1px solid #ddd;
}

.main{
    flex:1;
    padding:20px;
}

h1{
    margin-bottom:20px;
}

.section{
    margin-bottom:25px;
}

.section h3{
    margin-bottom:10px;
}

.control{
    margin-bottom:15px;
}

.control label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.dual-input{
    display:flex;
    gap:10px;
}

.dual-input input[type="range"]{
    flex:1;
}

.dual-input input[type="number"]{
    width:90px;
}

.results{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    margin-top:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

canvas{
    background:white;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
}

.hidden{
    display:none;
}

select,input{
    padding:5px;
}

.decision{
    font-size:20px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="sidebar">

<h1>Hypothesis Test</h1>

<div class="section">

<h3>Mode</h3>

<select id="mode">
<option value="manual">Manual Mode</option>
<option value="csv">CSV Mode</option>
</select>

</div>

<div id="manualSection">

<div class="section">

<h3>Statistic Type</h3>

<select id="calcType">
<option value="proportion">Proportion</option>
<option value="mean">Mean</option>
</select>

</div>

<div class="section">

<h3>Test Direction</h3>

<select id="tail">
<option value="left">Left-Tailed</option>
<option value="right">Right-Tailed</option>
<option value="two">Two-Tailed</option>
</select>

</div>

<div class="section">

<h3>Significance Level α</h3>

<input type="number" id="alpha" value="0.05" step="0.01">

</div>

<!-- PROPORTION -->

<div id="proportionInputs">

<div class="control">
<label>Benchmark Proportion (p₀)</label>

<div class="dual-input">
<input type="range" min="0" max="1" step="0.01" value="0.50" id="p0Range">
<input type="number" min="0" max="1" step="0.01" value="0.50" id="p0">
</div>

</div>

<div class="control">
<label>Sample Proportion (p̂)</label>

<div class="dual-input">
<input type="range" min="0" max="1" step="0.01" value="0.60" id="phatRange">
<input type="number" min="0" max="1" step="0.01" value="0.60" id="phat">
</div>

</div>

<div class="control">
<label>Sample Size (n)</label>

<div class="dual-input">
<input type="range" min="10" max="500" value="100" id="nRange">
<input type="number" value="100" id="n">
</div>

</div>

</div>

<!-- MEAN -->

<div id="meanInputs" class="hidden">

<div class="control">
<label>Benchmark Mean (μ₀)</label>

<div class="dual-input">
<input type="range" min="0" max="200" value="100" id="mu0Range">
<input type="number" value="100" id="mu0">
</div>

</div>

<div class="control">
<label>Sample Mean (x̄)</label>

<div class="dual-input">
<input type="range" min="0" max="200" value="110" id="xbarRange">
<input type="number" value="110" id="xbar">
</div>

</div>

<div class="control">
<label>Standard Deviation (σ)</label>

<div class="dual-input">
<input type="range" min="1" max="50" value="15" id="sigmaRange">
<input type="number" value="15" id="sigma">
</div>

</div>

<div class="control">
<label>Sample Size (n)</label>

<div class="dual-input">
<input type="range" min="10" max="500" value="100" id="nMeanRange">
<input type="number" value="100" id="nMean">
</div>

</div>

</div>

</div>

<!-- CSV -->

<div id="csvSection" class="hidden">

<h3>Upload CSV</h3>

<input type="file" id="csvFile" accept=".csv">

<br><br>

<label>Benchmark Group</label>
<select id="groupA"></select>

<br><br>

<label>Test Group</label>
<select id="groupB"></select>

</div>

</div>

<div class="main">

<h1>Results</h1>

<div class="results">

<div class="card">
<h3>Z Statistic</h3>
<p id="zValue">0</p>
</div>

<div class="card">
<h3>P-Value</h3>
<p id="pValue">0</p>
</div>

<div class="card">
<h3>Critical Value</h3>
<p id="criticalValue">±1.96</p>
</div>

<div class="card">
<h3>Decision</h3>
<p id="decision" class="decision">
Fail to Reject H₀
</p>
</div>

</div>

<div class="card" style="margin-top:20px">
<h3>Contextual Conclusion</h3>
<p id="conclusion">
Waiting for analysis...
</p>
</div>

<canvas id="normalChart"></canvas>

</div>

<script>

// MODE

const mode=document.getElementById("mode");
const manual=document.getElementById("manualSection");
const csv=document.getElementById("csvSection");

mode.addEventListener("change",()=>{

manual.classList.toggle("hidden",
mode.value==="csv");

csv.classList.toggle("hidden",
mode.value==="manual");

});

// TYPE

const calcType=document.getElementById("calcType");

calcType.addEventListener("change",()=>{

document.getElementById("proportionInputs")
.classList.toggle("hidden",
calcType.value!=="proportion");

document.getElementById("meanInputs")
.classList.toggle("hidden",
calcType.value!=="mean");

calculate();

});

// SYNC

function sync(range,input){

range.addEventListener("input",()=>{
input.value=range.value;
calculate();
});

input.addEventListener("input",()=>{
range.value=input.value;
calculate();
});

}

sync(p0Range,p0);
sync(phatRange,phat);
sync(nRange,n);

sync(mu0Range,mu0);
sync(xbarRange,xbar);
sync(sigmaRange,sigma);
sync(nMeanRange,nMean);

// NORMAL CDF

function erf(x){

let sign=(x>=0)?1:-1;
x=Math.abs(x);

let a1=0.254829592;
let a2=-0.284496736;
let a3=1.421413741;
let a4=-1.453152027;
let a5=1.061405429;
let p=0.3275911;

let t=1/(1+p*x);

let y=1-(((((
a5*t+a4)*t+a3)*t+a2)*t+a1)
*t*Math.exp(-x*x));

return sign*y;

}

function normalCDF(x){
return 0.5*(1+erf(x/Math.sqrt(2)));
}

// CHART

const ctx=document.getElementById('normalChart');

let x=[];
let y=[];

for(let i=-4;i<=4;i+=0.1){

x.push(i);
y.push(
(1/Math.sqrt(2*Math.PI))
*Math.exp(-(i*i)/2)
);

}

const chart=new Chart(ctx,{
type:'line',
data:{
labels:x,
datasets:[{
label:'Normal Curve',
data:y
}]
}
});

// CALCULATE

function calculate(){

let z;

if(calcType.value==="proportion"){

let p0v=parseFloat(p0.value);
let ph=parseFloat(phat.value);
let nv=parseFloat(n.value);

z=(ph-p0v)/
Math.sqrt(
(p0v*(1-p0v))/nv
);

}else{

let mu=parseFloat(mu0.value);
let xb=parseFloat(xbar.value);
let sig=parseFloat(sigma.value);
let nv=parseFloat(nMean.value);

z=(xb-mu)/(sig/Math.sqrt(nv));

}

let p;

let tail=document.getElementById("tail").value;

if(tail==="left"){
p=normalCDF(z);
}
else if(tail==="right"){
p=1-normalCDF(z);
}
else{
p=2*(1-normalCDF(Math.abs(z)));
}

document.getElementById("zValue")
.innerText=z.toFixed(4);

document.getElementById("pValue")
.innerText=p.toFixed(6);

let alpha=
parseFloat(
document.getElementById("alpha").value
);

let decision=
p<alpha?
"Reject H₀":
"Fail to Reject H₀";

document.getElementById("decision")
.innerText=decision;

document.getElementById("conclusion")
.innerText=
decision==="Reject H₀"
?
"There is sufficient statistical evidence to support the alternative hypothesis."
:
"There is insufficient statistical evidence to support the alternative hypothesis.";

}

document.getElementById("alpha")
.addEventListener("input",calculate);

document.getElementById("tail")
.addEventListener("change",calculate);

calculate();

</script>

</body>
</html>
